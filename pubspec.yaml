name: vad_app
description: "KissKH - Asian Drama & Anime Streaming"
publish_to: 'none'
version: 0.5.7

environment:
  sdk: ">=3.8.1 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Core
  http: ^1.6.0
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  get: ^4.7.3
  get_storage: ^2.1.1
  google_fonts: ^6.2.1
  iconsax: ^0.0.8
  carousel_slider: ^5.0.0
  shimmer: ^3.0.0
  intl: ^0.20.2
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_android_video: ^1.3.8
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.2
  timeago: ^3.6.1
  package_info_plus: ^9.0.1
  wakelock_plus: ^1.4.0
  path_provider: ^2.1.5
  path: ^1.9.1
  crypto: ^3.0.7
  html: ^0.15.6
  screen_brightness: ^2.1.7
  flutter_volume_controller: ^1.3.4
  flutter_timezone: ^5.0.1
  animations: ^2.1.1
  sensors_plus: ^7.0.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/images/app_logo.png"
  min_sdk_android: 21
  notification_icon:
    android: true
    image_path: "assets/images/app_logo.png"
