name: Build & Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v0.5.2)'
        required: true
        default: 'v0.5.2'
      release_notes:
        description: 'Release changelog notes'
        required: false
        default: 'Bug fixes and performance improvements.'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Production ARM64 & Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Production ARM64 APK
        run: |
          flutter build apk --flavor production --dart-define=BUILD_PROFILE=production --target-platform android-arm64
          cp build/app/outputs/flutter-apk/app-production-release.apk build/app/outputs/flutter-apk/Dramwhat.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Dramawhat ${{ github.ref_name || inputs.version }}"
          tag_name: ${{ github.ref_name || inputs.version }}
          body: ${{ inputs.release_notes }}
          generate_release_notes: true
          files: |
            build/app/outputs/flutter-apk/Dramwhat.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
